[workspace]
members = [
    "crates/vexrec-core",
    "crates/vexrec-portal",
    "crates/vexrec-pipeline",
    "crates/vexrec-ui",
    "crates/vexrec-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aerovex Engineering <engineering@aerovex.net>"]
license = "MIT"
repository = "https://github.com/aerovexhq/vexrec"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
arboard = "3.6"
imageproc = "0.27"
x11rb = { version = "0.14", features = ["shm"] }
tauri = { version = "2.0", default-features = false, features = ["wry", "tray-icon", "image-png", "custom-protocol"] }
tauri-build = { version = "2.0", default-features = false }

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
