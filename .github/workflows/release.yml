name: Release Vexrec

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: release-vexrec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Package Vexrec Linux Release Assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Packaging Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^[0-9] ]]; then
            V="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.1.0"
          fi
          echo "version=${V}" >> $GITHUB_OUTPUT
          echo "VERSION=${V}" >> $GITHUB_ENV

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire \
            pipewire \
            libpipewire-0.3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Vexrec Release Binary
        run: |
          cargo build --release -p vexrec-cli
          strip target/release/vexrec || true

      - name: Assemble Debian Package and Portable Tarball
        run: |
          mkdir -p dist

          # Build Debian package
          bash packaging/deb/create_deb.sh "${VERSION}"
          cp "target/vexrec_${VERSION}_amd64.deb" dist/

          # Standalone binary
          cp target/release/vexrec dist/vexrec
          chmod +x dist/vexrec

          # Portable Tarball
          TARBALL="vexrec-linux-x86_64.tar.gz"
          TAR_DIR="target/tarball_staging"
          rm -rf "${TAR_DIR}"
          mkdir -p "${TAR_DIR}/data" "${TAR_DIR}/icons"

          cp target/release/vexrec "${TAR_DIR}/vexrec"
          chmod +x "${TAR_DIR}/vexrec"
          cp install.sh "${TAR_DIR}/install.sh"
          chmod +x "${TAR_DIR}/install.sh"
          cp data/vexrec.desktop "${TAR_DIR}/data/vexrec.desktop"
          cp README.md LICENSE "${TAR_DIR}/" 2>/dev/null || true
          cp -r crates/vexrec-ui/icons/* "${TAR_DIR}/icons/" 2>/dev/null || true

          tar -czf "dist/${TARBALL}" -C "${TAR_DIR}" .
          cp "dist/${TARBALL}" "dist/vexrec-v${VERSION}-linux-x86_64.tar.gz"

          # Compute SHA256 Checksums
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Publish Official Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "vexrec ${{ env.VERSION }}: Modern and Minimalistic Linux Screen Recorder and Screenshot Suite"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
